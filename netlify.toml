# Netlify auto-detects Next.js and uses its Next.js runtime (OpenNext adapter).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Netlify's secrets scanner fails the build when an env var's value appears in the
  # repo/build output. These are plain ClickUp/Sheets IDs and a timezone, not secrets,
  # and they are intentionally documented in .env.local.example / README.
  # Real secrets (CLICKUP_API_TOKEN, APPROVER_PASSWORD,
  # GOOGLE_SERVICE_ACCOUNT_KEY) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_EMAIL_DOMAINS,ALLOWED_EMAILS,AUTH_REQUIRED,CLICKUP_FOLDER_ID,CLICKUP_LIST_IDS,CLICKUP_DEFAULT_LIST_ID,CLICKUP_REQUEST_LIST_ID,CLICKUP_TEAM_ID,ROADMAP_TIMEZONE,CLICKUP_REQUEST_TAG,GOOGLE_ACCOMPLISHMENTS_SHEET_ID,GOOGLE_ACCOMPLISHMENTS_SHEET_NAME,GOOGLE_SHEET_NAME,CLICKUP_FIELD_ROADMAP_START,CLICKUP_FIELD_ROADMAP_END,CLICKUP_FIELD_PILLAR,CLICKUP_FIELD_SPRINT,CLICKUP_FIELD_BIG_SWING"
